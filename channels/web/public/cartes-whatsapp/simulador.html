<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulador local de Cartes</title>
  <style>
    :root{font-family:Arial,sans-serif;background:#efeae2;color:#202124}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(760px,100%);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px #0002}
    header{padding:18px 22px;background:#1f6f50;color:#fff} h1{margin:0;font-size:22px} header p{margin:5px 0 0;opacity:.9}
    #chat{height:520px;overflow:auto;padding:18px;background:#efeae2;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:82%;padding:11px 14px;border-radius:12px;white-space:pre-wrap;line-height:1.35}.bot{background:#fff;align-self:flex-start}.user{background:#d9fdd3;align-self:flex-end}
    .card{background:#fff;border-radius:12px;padding:12px;align-self:flex-start;width:min(520px,94%)}
    .card h2{font-size:18px;margin:0 0 10px}.option{display:block;width:100%;text-align:left;border:0;border-top:1px solid #ddd;background:#fff;padding:12px 5px;cursor:pointer}.option strong,.option span{display:block}.option span{font-size:13px;color:#666;margin-top:3px}
    form{display:flex;gap:8px;padding:14px;background:#f7f7f7;border-top:1px solid #ddd}input{flex:1;padding:12px;border:1px solid #bbb;border-radius:10px}button[type=submit]{border:0;border-radius:10px;padding:0 18px;background:#1f6f50;color:#fff;font-weight:700}
    .tools{display:flex;gap:10px;padding:10px 14px;background:#fff;border-top:1px solid #ddd;font-size:13px}.tools button{border:1px solid #bbb;background:#fff;border-radius:8px;padding:7px 10px}.status{margin-left:auto}
  </style>
</head>
<body>
<main>
  <header><h1>Cartes, simulador local</h1><p>Prueba menús y flujos sin publicar en Netlify ni usar WhatsApp.</p></header>
  <section id="chat" aria-live="polite"></section>
  <form id="form"><input id="entrada" aria-label="Mensaje" placeholder="Escribe Hola, ., geeer o una pregunta"><button type="submit">Enviar</button></form>
  <div class="tools"><button id="menu" type="button">Menú</button><button id="reset" type="button">Reiniciar</button><span class="status" id="estado"></span></div>
</main>
<script>
let sesion={plusActivo:false,consultasUsadas:0,limiteConsultas:5};
const chat=document.querySelector('#chat');
const estado=document.querySelector('#estado');
function marcarNegritas(texto){return texto.replace(/\*([^*]+)\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function msg(contenido,clase='bot'){const d=document.createElement('div');d.className='msg '+clase;d.innerHTML=marcarNegritas(contenido);chat.append(d)}
function menu(data){const c=document.createElement('div');c.className='card';c.innerHTML=`<h2>${data.button||'Menú'}</h2><p>${data.body||''}</p>`;(data.sections||[]).flatMap(s=>s.rows||[]).forEach(r=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<strong>${r.title}</strong><span>${r.description||''}</span>`;b.onclick=()=>enviar('',r.id,r.title);c.append(b)});chat.append(c)}
function render(m){if(m.tipo==='texto')msg(m.contenido);if(m.tipo==='menu')menu(m.menu);if(m.tipo==='botones'){const c=document.createElement('div');c.className='card';m.botones.forEach(r=>{const b=document.createElement('button');b.className='option';b.textContent=r.titulo;b.onclick=()=>enviar('',r.id,r.titulo);c.append(b)});chat.append(c)}}
function refresh(){estado.textContent=`Consultas simuladas: ${sesion.consultasUsadas}/${sesion.plusActivo?50:5}`;chat.scrollTop=chat.scrollHeight}
async function enviar(entrada='',id='',visible=''){if(entrada||visible)msg(visible||entrada,'user');const r=await fetch('/api/simular',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({entrada,id,sesion})});const data=await r.json();sesion=data.sesion;data.mensajes.forEach(render);refresh()}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const i=document.querySelector('#entrada');enviar(i.value);i.value=''};
document.querySelector('#menu').onclick=()=>enviar('Menú');
document.querySelector('#reset').onclick=()=>{sesion={plusActivo:false,consultasUsadas:0,limiteConsultas:5};chat.innerHTML='';enviar('Hola')};
enviar('Hola');
</script>
</body>
</html>
