<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Cartes</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101114; color: #f5f5f5; }
    main { width: min(560px, calc(100% - 40px)); padding: 32px; border: 1px solid #34363d; border-radius: 18px; background: #191b20; text-align: center; }
    h1 { margin-top: 0; }
    p { line-height: 1.6; color: #d3d5dc; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Cartes Plus</h1>
    <p id="status">El proceso de suscripción fue completado en el proveedor de pago. Cartes Plus se activará automáticamente cuando recibamos la confirmación del pago.</p>
    <p id="detail">Puedes volver a Cartes y consultar Mi suscripción para verificar su estado.</p>
    <p>Ya puedes cerrar esta ventana.</p>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);

      const title = document.getElementById("title");
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");

      const provider =
        String(params.get("provider") || "").toLowerCase();

      const result =
        String(params.get("result") || "").toLowerCase();

      // CARTES_PAYPAL_RETURN_UI_V112
      if (params.get("flow") !== "review_pack") {
        if (provider === "paypal" && result === "cancel") {
          title.textContent = "Suscripción no completada";
          status.textContent =
            "Cancelaste el proceso en PayPal.";
          detail.textContent =
            "Cartes Plus no fue activado y tu plan no cambió.";
          return;
        }

        if (provider === "paypal" && result === "success") {
          title.textContent = "Confirmando Cartes Plus";
          status.textContent =
            "PayPal recibió tu aprobación.";
          detail.textContent =
            "Cartes Plus se activará automáticamente cuando PayPal confirme la suscripción. Consulta Mi suscripción en unos momentos.";
          return;
        }

        return;
      }

      title.textContent = "Revisiones adicionales";

      if (["cancel", "failure"].includes(result)) {
        status.textContent = "La compra no fue completada.";
        detail.textContent =
          "No se agregaron revisiones adicionales ni se realizó ningún cambio en tu cuenta.";
        return;
      }

      if (result === "pending") {
        status.textContent = "Mercado Pago está procesando la operación.";
        detail.textContent =
          "Las revisiones se agregarán cuando el pago sea confirmado. Consulta Mi suscripción en unos momentos.";
        return;
      }

      async function complete() {
        let body;

        if (provider === "paypal") {
          const orderId = params.get("token");

          if (!orderId) {
            throw new Error(
              "PayPal no devolvió el identificador de la orden."
            );
          }

          body = {
            action: "paypal_complete",
            order_id: orderId
          };
        }
        else if (provider === "mercadopago") {
          const paymentId =
            params.get("payment_id") ||
            params.get("collection_id");

          if (!paymentId) {
            status.textContent = "El pago fue recibido por Mercado Pago.";
            detail.textContent =
              "Cartes agregará las revisiones cuando Mercado Pago confirme la operación. Consulta Mi suscripción en unos momentos.";
            return;
          }

          body = {
            action: "mercadopago_complete",
            payment_id: paymentId
          };
        }
        else {
          throw new Error("Proveedor de pago no reconocido.");
        }

        status.textContent = "Confirmando tu compra…";
        detail.textContent =
          "No cierres esta ventana hasta que finalice la confirmación.";

        const response = await fetch(
          "/.netlify/functions/cartes-review-pack",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body),
            cache: "no-store"
          }
        );

        const data =
          await response.json().catch(() => ({}));

        if (!response.ok || !data?.ok) {
          throw new Error(
            data?.error ||
            "No fue posible confirmar la compra."
          );
        }

        const reviewPackSize =
          Number(data?.reviews?.creditos_por_paquete);

        status.textContent =
          Number.isSafeInteger(reviewPackSize) && reviewPackSize > 0
            ? `¡Compra confirmada! Se agregaron ${reviewPackSize} revisiones adicionales a tu cuenta Cartes.`
            : "¡Compra confirmada! Se agregaron revisiones adicionales a tu cuenta Cartes.";

        if (data?.reviews) {
          detail.textContent =
            `Revisiones disponibles: ${data.reviews.disponibles}. Paquetes adicionales: ${data.reviews.paquetes_comprados} de ${data.reviews.paquetes_maximo}.`;
        }
        else {
          detail.textContent =
            "Puedes volver a Cartes y consultar Mi suscripción.";
        }
      }

      void complete().catch((error) => {
        status.textContent =
          "No pudimos confirmar automáticamente la compra.";

        detail.textContent =
          error instanceof Error
            ? error.message
            : "Consulta Mi suscripción antes de intentar pagar nuevamente.";
      });
    })();
  </script>
</body>
</html>
